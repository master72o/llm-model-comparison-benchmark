name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov
      - name: Run Pytest Suite
        run: |
          pytest --cov=model_eval tests/
      - name: Run Model Comparison Benchmark CLI
        run: |
          python -m model_eval.cli run --dataset data/comparison_benchmark_dataset.jsonl --output-dir results --report-path reports/model_comparison_report.md --figures-dir reports/figures
